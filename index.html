    <!-- Theme bootstrap: apply the saved mode + accent before paint to avoid a
         flash. Dark is the default; the user can opt into light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t === 'light' ? '#e9edfb' : '#050510')
          var a = localStorage.getItem('accent')
          if (a) document.documentElement.dataset.accent = a
        } catch (e) {}
      })()
    </script>
